services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: riviu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: riviu
    volumes:
      - riviu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riviu -d riviu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://riviu:${POSTGRES_PASSWORD}@postgres:5432/riviu?schema=public
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Thiếu ADMIN_EMAIL trong .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Thiếu ADMIN_PASSWORD trong .env}
    volumes:
      - riviu_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://taskscatt.click}
    restart: unless-stopped
    environment:
      API_URL_INTERNAL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Host nginx đang giữ :80 (Ubuntu default). Publish nội bộ để vhost
      # taskscatt.click trên máy chủ proxy vào đây. NAT WAN 80 → 192.168.1.40:80.
      - "127.0.0.1:18090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  riviu_pgdata:
  riviu_uploads:
