# TLS binds the LAN IP only. Tailscale already owns 100.74.131.110:443,
# so listen 443 default (0.0.0.0) fails with "Address already in use".
# WAN NAT 443 → 192.168.1.40:443, so public HTTPS still reaches this vhost.
server {
    listen 192.168.1.40:443 ssl;
    server_name taskscatt.click www.taskscatt.click;

    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/taskscatt.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskscatt.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name taskscatt.click www.taskscatt.click;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
